name: Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        type: string
        default: ".github/labeler.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: ${{ inputs.configuration-path }}
