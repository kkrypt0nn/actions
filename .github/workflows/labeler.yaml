name: Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        type: string
        default: ".github/labeler.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Labeler
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          configuration-path: ${{ inputs.configuration-path }}
