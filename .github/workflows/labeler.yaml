name: Labeler

on:
  workflow_call:
    inputs:
      configuration-path:
        type: string
        default: ".github/labeler.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Labeler
        uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6
        with:
          configuration-path: ${{ inputs.configuration-path }}
